<!-- โครงหน้าตั้งค่า (การ์ดพนักงานถูกเติมโดย js/pages/settings.js) -->
<section class="set" data-screen-label="ตั้งค่า">
  <header class="set__top">
    <div class="set__topText">
      <h1 class="set__h1" id="set-title"></h1>
      <p class="set__h2" id="set-sub"></p>
    </div>
    <span class="set__chip" id="set-count"></span>
  </header>

  <section class="set__card">
    <header class="set__cardHead">
      <span class="set__cardIcon" data-glyph="users"></span>
      <div>
        <h2 class="set__cardTitle" id="set-staff-title"></h2>
        <p class="set__cardSub" id="set-staff-sub"></p>
      </div>
    </header>
    <div class="set__list" id="set-list"></div>
    <button class="set__add" type="button" id="set-add"></button>
  </section>
</section>
